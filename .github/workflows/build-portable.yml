name: Build Portable (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/naps2-repo-copy-n32wvi
    paths:
      - '.github/workflows/build-portable.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Compute version (1.0.<run_number>)
        id: ver
        shell: pwsh
        run: |
          $v = "1.0.$env:GITHUB_RUN_NUMBER"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v"

      - name: Publish ApneScan (win-x64, self-contained, multi-file)
        shell: pwsh
        run: >
          dotnet publish ApneScan.App.WinForms/ApneScan.App.WinForms.csproj
          -c Release-Zip
          -f net10.0-windows
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}
          -p:FileVersion=${{ steps.ver.outputs.version }}
          -o publish/ApneScan

      - name: Trim unneeded DLLs (WPF/diagnostics) to reduce size
        shell: pwsh
        run: |
          $dir = "publish/ApneScan"
          $exclude = @(
            'Microsoft.VisualBasic','System.Data','System.Private.DataContract',
            'System.Windows.Forms.Design','D3D','Presentation','Reach',
            'System.Windows.Controls.Ribbon','System.Windows.Input',
            'System.Windows.Presentation','System.Xaml','UIAutomation',
            'WindowsBase','wpfgfx','createdump','Microsoft.DiaSymReader',
            'mscordaccore','mscordbi','PenImc'
          )
          function IsExcluded($name) {
            foreach ($e in $exclude) { if ($name -like "$e*") { return $true } }
            return $false
          }
          # Delete matching files (never the main exe)
          Get-ChildItem $dir -File | Where-Object {
            ($_.Extension -in '.dll','.exe') -and ($_.Name -ne 'ApneScan.exe') -and (IsExcluded $_.Name)
          } | ForEach-Object { Write-Host "remove $($_.Name)"; Remove-Item $_.FullName -Force }
          # Keep deps.json consistent: drop the same entries
          $depsPath = Join-Path $dir 'ApneScan.deps.json'
          if (Test-Path $depsPath) {
            $deps = Get-Content $depsPath -Raw | ConvertFrom-Json -Depth 100
            foreach ($tk in $deps.targets.PSObject.Properties) {
              foreach ($lib in $tk.Value.PSObject.Properties) {
                foreach ($sec in @('runtime','native','resources')) {
                  $s = $lib.Value.$sec
                  if ($s) {
                    foreach ($f in @($s.PSObject.Properties)) {
                      $fname = ($f.Name -split '/')[-1]
                      if (IsExcluded $fname) { $s.PSObject.Properties.Remove($f.Name) }
                    }
                  }
                }
              }
            }
            $deps | ConvertTo-Json -Depth 100 | Set-Content $depsPath -Encoding UTF8
          }

      - name: Show size
        shell: pwsh
        run: |
          $bytes = (Get-ChildItem publish/ApneScan -Recurse | Measure-Object Length -Sum).Sum
          "Unpacked size: {0:N1} MB" -f ($bytes/1MB)

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/ApneScan -DestinationPath ApneScan-portable-win-x64.zip -Force

      - name: Generate update.json (auto-update feed)
        shell: pwsh
        run: |
          $zip = "ApneScan-portable-win-x64.zip"
          $hash = [System.Security.Cryptography.SHA256]::Create().ComputeHash([System.IO.File]::ReadAllBytes($zip))
          $sha256 = [Convert]::ToBase64String($hash)
          $zipUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/apnescan-portable/$zip"
          $obj = [ordered]@{
            versions = @(
              [ordered]@{
                name = "${{ steps.ver.outputs.version }}"
                requires = [ordered]@{ gte = "1.0.0" }
                files = [ordered]@{
                  zip = [ordered]@{ url = $zipUrl; sha256 = $sha256 }
                }
              }
            )
          }
          $obj | ConvertTo-Json -Depth 10 | Set-Content -Path update.json -Encoding UTF8
          Get-Content update.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApneScan-portable-win-x64
          path: ApneScan-portable-win-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish ZIP + update feed to a GitHub Release (direct download)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "apnescan-portable"
          gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag 2>$null
          gh release create $tag ApneScan-portable-win-x64.zip update.json `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "ApneScan ${{ steps.ver.outputs.version }} (portable, win-x64)" `
            --notes "Self-contained Windows x64 portable build of ApneScan, version ${{ steps.ver.outputs.version }}. Download the ZIP, extract it, and run ApneScan.exe inside the ApneScan folder. The app checks this release for updates and can update itself automatically. On first launch Windows SmartScreen may warn (unsigned build) - click 'More info' then 'Run anyway'. Keep all files together in the folder."
