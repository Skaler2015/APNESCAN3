name: Build Portable (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/naps2-repo-copy-n32wvi
    paths:
      - '.github/workflows/build-portable.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Bundle English OCR data (offline document naming)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ApneScan.Lib/ocr | Out-Null
          $url = "https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata"
          Invoke-WebRequest -Uri $url -OutFile ApneScan.Lib/ocr/eng.traineddata
          $mb = (Get-Item ApneScan.Lib/ocr/eng.traineddata).Length/1MB
          "eng.traineddata size: {0:N1} MB" -f $mb

      - name: Compute version (1.0.<run_number>)
        id: ver
        shell: pwsh
        run: |
          $v = "1.0.$env:GITHUB_RUN_NUMBER"
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version $v"

      - name: Publish ApneScan as a single self-contained .exe (max compatibility)
        shell: pwsh
        run: >
          dotnet publish ApneScan.App.WinForms/ApneScan.App.WinForms.csproj
          -c Release
          -f net10.0-windows
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=none
          -p:DebugSymbols=false
          -p:Version=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}
          -p:FileVersion=${{ steps.ver.outputs.version }}
          -o publish

      - name: Show output
        shell: pwsh
        run: |
          Get-ChildItem publish | Sort-Object Length -Descending | Format-Table Name,Length
          $mb = (Get-Item publish/ApneScan.exe).Length/1MB
          "ApneScan.exe size: {0:N1} MB" -f $mb

      - name: Generate update.json (auto-update feed)
        shell: pwsh
        run: |
          $exe = "publish/ApneScan.exe"
          $hash = [System.Security.Cryptography.SHA256]::Create().ComputeHash([System.IO.File]::ReadAllBytes($exe))
          $sha256 = [Convert]::ToBase64String($hash)
          $exeUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/apnescan-portable/ApneScan.exe"
          $obj = [ordered]@{
            versions = @(
              [ordered]@{
                name = "${{ steps.ver.outputs.version }}"
                requires = [ordered]@{ gte = "1.0.0" }
                files = [ordered]@{
                  exe = [ordered]@{ url = $exeUrl; sha256 = $sha256 }
                }
              }
            )
          }
          $obj | ConvertTo-Json -Depth 10 | Set-Content -Path update.json -Encoding UTF8
          Get-Content update.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApneScan-exe
          path: publish/ApneScan.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish exe + update feed to a GitHub Release (direct download)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "apnescan-portable"
          gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag 2>$null
          gh release create $tag publish/ApneScan.exe update.json `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "ApneScan ${{ steps.ver.outputs.version }} (single .exe, win-x64)" `
            --notes "Single-file, self-contained Windows x64 build of ApneScan, version ${{ steps.ver.outputs.version }}. Download ApneScan.exe and double-click to run - no install, no folder. The app checks this release for updates and updates itself automatically. On first launch Windows SmartScreen may warn (unsigned build) - click 'More info' then 'Run anyway'. First launch is a little slower (it unpacks once)."
