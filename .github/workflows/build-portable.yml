name: Build Portable (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/naps2-repo-copy-n32wvi
    paths:
      - '.github/workflows/build-portable.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish ApneScan as a single self-contained .exe
        shell: pwsh
        run: >
          dotnet publish ApneScan.App.WinForms/ApneScan.App.WinForms.csproj
          -c Release-Zip
          -f net10.0-windows
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -p:DebugType=none
          -o publish

      - name: Show output
        shell: pwsh
        run: Get-ChildItem publish | Sort-Object Length -Descending | Format-Table Name,Length

      - name: Upload single exe as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApneScan-exe
          path: publish/ApneScan.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish single exe to a GitHub Release (direct .exe download)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "apnescan-portable"
          gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag 2>$null
          gh release create $tag publish/ApneScan.exe `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "ApneScan - portable single .exe (win-x64)" `
            --notes "Single-file, self-contained Windows x64 build of ApneScan. Download ApneScan.exe below and run it. On first launch Windows SmartScreen may warn (unsigned build) - click 'More info' then 'Run anyway'."
